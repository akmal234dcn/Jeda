    <div class="progress ${doneR?'ok':''}"><i style="width:${totalR.length?Math.round(doneR/totalR.length*100):0}%"></i></div>
    <div class="hr"></div>
    ${miniRow('Tuntas (masuk jadwal)', state.courses.filter(c=>c.status==='pass'||c.status==='mastery').length, 'ok')}
    ${miniRow('Belum tuntas (belajar ulang)', failed.length, 'bad')}
    ${miniRow('Belum dinilai', state.courses.filter(c=>c.status!=='pass'&&c.status!=='mastery'&&c.status!=='fail').length, 'mute')}
  </div>`;

  h += `<div class="card"><div class="card-head"><h3>${icon('clock',2)}</h3><h3>Aktivitas terakhir</h3></div>
    <div style="padding:6px 0">`;
  h += state.activity.length ? state.activity.slice(0,7).map(a => {
    const col = a.type==='fail'?'var(--bad)':a.type==='pass'?'var(--ok)':a.type==='review'?'var(--brand)':'var(--ink-3)';
    return `<div style="display:flex;gap:10px;padding:8px 18px;align-items:flex-start">
      <span class="dot" style="background:${col};margin-top:6px"></span>
      <div style="flex:1;min-width:0"><div class="small" style="line-height:1.4">${esc(a.text)}</div>
      <div class="xsmall muted">${new Date(a.at).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div></div>`;
  }).join('') : `<div class="empty" style="padding:26px 20px"><p class="small">Belum ada aktivitas.</p></div>`;
  h += `</div></div>`;

  h += `<div class="card card-pad" style="background:var(--brand-soft);border-color:transparent">
    <h3 style="font-size:14px;color:var(--brand-ink);margin-bottom:6px">${icon('info',2)} Kenapa ${state.settings.passingGrade}%?</h3>
    <p class="small" style="color:var(--brand-ink);opacity:.85;line-height:1.55">
    Ambang ketuntasan mengikuti konsensus <i>mastery learning</i> (Bloom 1984; McGaghie) yang memakai kriteria 80–90%,
    dan batas 85% dari "Eighty Five Percent Rule" (Wilson dkk., 2019). Skor ≥85% dapat ladder interval yang lebih longgar.</p>
    <button class="btn btn-sm" style="margin-top:10px" data-go="method">Baca dasar risetnya</button></div>`;

  h += `</div></div>`;
  $('#view-dash').innerHTML = h;
  bindActions(); bindEventRows();
}
function statCard(k, v, n, tone){
  const col = tone==='ok'?'var(--ok)':tone==='bad'?'var(--bad)':tone==='warn'?'var(--warn)':tone==='brand'?'var(--brand)':'var(--ink-2)';
  return `<div class="card stat"><div class="k">${k}</div><div class="v mono" style="color:${col}">${v}</div><div class="n">${n}</div></div>`;
}
function miniRow(k, v, tone){
  const col = tone==='ok'?'var(--ok)':tone==='bad'?'var(--bad)':'var(--ink-3)';
  return `<div class="kv" style="padding:3px 0"><span class="k">${k}</span><span class="v" style="color:${col}">${v}</span></div>`;
}
function eventRow(e, big){
  const c = e.course;
  const isOver = e.due < todayISO() && e.state === 'pending' && e.kind !== 'exam';
  const done = e.state === 'done';
  const tone = e.kind === 'exam' ? 'var(--warn)' : e.kind === 'remedial' ? 'var(--bad)' : c.color || 'var(--brand)';
  const badge = e.kind === 'exam' ? `<span class="badge b-warn">${icon('target')}UJIAN</span>`
    : e.kind === 'remedial' ? `<span class="badge b-bad">${icon('refresh')}Belajar ulang + tes</span>`
    : done ? `<span class="badge b-mute">${icon('check')}Selesai${e.rating?' • '+rateLabel(e.rating):''}</span>`
    : isOver ? `<span class="badge b-bad">Terlambat ${-diffDays(e.due, todayISO())} hr</span>`
    : `<span class="badge b-brand">Tahap ${e.label}</span>`;
  const act = done ? `<button class="btn btn-sm" data-act="review" data-id="${c.id}" data-item="${e.id}">Lihat</button>`
    : e.kind === 'exam' ? `<button class="btn btn-sm" data-act="export-ics-one" data-id="${c.id}">Export</button>`
    : e.kind === 'remedial' ? `<button class="btn btn-sm btn-bad" data-act="score" data-id="${c.id}">Isi skor tes ulang</button>`
    : `<button class="btn btn-sm btn-primary" data-act="review" data-id="${c.id}" data-item="${e.id}">${icon('play')}Mulai sesi</button>`;
  return `<div class="ritem ${done?'done':''} ${isOver?'overdue':''}" data-course="${c.id}">
    <div class="bar" style="background:${tone}"></div>
    ${e.kind==='review'&&!done?`<div class="stepnum">${e.label.replace(/[RP]/,'')}</div>`:`<div class="stepnum" style="background:var(--bg-2);color:var(--ink-3)">${icon(e.kind==='exam'?'target':'book',2)}</div>`}
    <div style="flex:1;min-width:0">
      <div class="ttl">${esc(c.name)}</div>
      <div class="meta">${badge}
        <span>${IDFmt.med.format(parseISO(e.due))} • ${relDay(e.due)}</span>
        ${e.kind==='review'?`<span class="muted">hari ke-${e.offset ?? '—'}</span>`:''}
        ${weakTopics(c).length?`<span class="badge b-warn">${weakTopics(c).length} topik lemah</span>`:''}
      </div>
    </div>
    <div class="acts">${big?act:`<button class="btn btn-sm btn-ghost" data-act="open-course" data-id="${c.id}">Detail</button>`}</div>
  </div>`;
}
function bindEventRows(){
  $$('.ritem[data-course]').forEach(r => {
    const b = r.querySelector('.acts .btn');
    if (!b) r.onclick = () => { const c = byId(r.dataset.course); if (c) courseDetail(c); };
  });
}

/* ============================== MATA KULIAH ============================== */
function renderCourses(){
  const FILTERS = [['all','Semua'],['pass','Tuntas'],['fail','Belum tuntas'],['ungraded','Belum dinilai']];
  let list = state.courses.slice();
  if (route.q) list = list.filter(c => (c.name+' '+(c.lecturer||'')+' '+(c.topics||[]).map(t=>t.name).join(' ')).toLowerCase().includes(route.q.toLowerCase()));
  if (route.filter === 'pass') list = list.filter(c => c.status==='pass'||c.status==='mastery');
  if (route.filter === 'fail') list = list.filter(c => c.status==='fail');
  if (route.filter === 'ungraded') list = list.filter(c => !['pass','mastery','fail'].includes(c.status));
  list.sort((a,b) => {
    const na = nextItem(a), nb = nextItem(b);
    if (na && nb) return na.due < nb.due ? -1 : 1;
    if (na) return -1; if (nb) return 1;
    return a.name.localeCompare(b.name);
  });

  let h = `<div class="card card-pad" style="margin-bottom:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="position:relative;flex:1;min-width:190px">
      <input class="input" id="q" placeholder="Cari mata kuliah atau topik…" value="${esc(route.q)}" style="padding-left:34px">
      <span style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:16px;height:16px;display:block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
    </div>
    <div class="tabs">${FILTERS.map(f => `<button class="tab ${route.filter===f[0]?'active':''}" data-filter="${f[0]}">${f[1]}
      <span class="muted" style="font-weight:800">${f[0]==='all'?state.courses.length:state.courses.filter(c=>f[0]==='pass'?(c.status==='pass'||c.status==='mastery'):f[0]==='fail'?c.status==='fail':!['pass','mastery','fail'].includes(c.status)).length}</span></button>`).join('')}</div>
  </div>`;

  if (!list.length){
    h += `<div class="card"><div class="empty">${icon('book',1.6)}<h4>${state.courses.length?'Tidak ada yang cocok':'Belum ada mata kuliah'}</h4>
      <p class="small">${state.courses.length?'Coba ubah kata kunci atau filter.':'Mulai dengan menambahkan mata kuliah yang sedang kamu ambil.'}</p>
      <button class="btn btn-primary" style="margin-top:14px" data-act="new-course">${icon('plus',2.4)}Tambah Matkul</button></div></div>`;
  } else {
    h += `<div class="grid g3">${list.map(courseCard).join('')}</div>`;
  }
  $('#view-courses').innerHTML = h;
  const q = $('#q'); if (q) q.oninput = () => { route.q = q.value; renderCourses(); const nq = $('#q'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  $$('[data-filter]').forEach(b => b.onclick = () => { route.filter = b.dataset.filter; renderCourses(); });
  bindActions();
}

function courseCard(c){
  const g = gradeOf(c.lastScore, c);
  const nx = nextItem(c);
  const p = courseProgress(c);
  const weak = weakTopics(c);
  const initials = c.name.split(/\s+/).filter(w=>/[A-Za-z0-9]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase() || 'MK';
  return `<div class="card course">
    <div class="course-top">
      <div class="course-av" style="background:${c.color||'#4f46e5'}">${esc(initials)}</div>
      <div style="flex:1;min-width:0">
        <div class="course-name" style="overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
        <div class="course-sub">${esc(c.lecturer||'Tanpa dosen')}${c.credits?` • ${c.credits} SKS`:''}</div>
      </div>
      <span class="badge ${g.cls}">${g.label}</span>
    </div>
    <div class="course-body">
      <div style="display:flex;align-items:flex-end;gap:12px">
        <div class="score-big"><span class="n" style="color:${g.tier==='fail'?'var(--bad)':g.tier==='mastery'?'var(--ok)':'var(--ink)'}">${c.lastScore==null?'—':c.lastScore}</span>
          <span class="u">/ 100</span></div>
        <div style="margin-left:auto;text-align:right">
          <div class="xsmall muted">passing grade</div>
          <div class="small strong">${pgOf(c)}%${mgOf(c)!==state.settings.masteryGrade||c.masteryGrade?` • mastery ${mgOf(c)}%`:''}</div>
        </div>
      </div>
      ${c.lastScore==null?`<div class="banner info" style="margin:0;padding:10px 12px">${icon('info',2.1)}<div><span>Belum ada skor tes. Masukkan skor untuk mengaktifkan jadwal spaced repetition.</span></div></div>`:''}
      ${c.status==='fail'?`<div class="banner bad" style="margin:0;padding:10px 12px">${icon('refresh',2.1)}<div><b style="font-size:12.5px">Belajar ulang besok</b><span>Skor di bawah ${pgOf(c)}%. Belum dapat jadwal spaced repetition sampai tes ulang tuntas.</span></div></div>`:''}
      ${(c.status==='pass'||c.status==='mastery')?`<div>
        <div class="kv" style="margin-bottom:6px"><span class="k">Progres ladder</span><span class="v">${p.done}/${p.total} tahap</span></div>
        <div class="ladder">${activeLadder(c).map((_,i)=>{
          const r=i+1;
          const its=(c.schedule||[]).filter(s=>s.rung===r&&s.kind==='review');
          const it=its.find(s=>s.state==='pending') || its[its.length-1];
          const cls = it&&it.state==='done'?'done':it&&it.state==='pending'&&it.due<todayISO()?'late':it&&it.state==='pending'&&nx&&nx.id===it.id?'now':'';
          return `<div class="rung ${cls}"><div class="bar" style="height:${8+i*5}px"></div><div class="d">${r}</div></div>`;}).join('')}</div>
      </div>`:''}
      <div class="hr" style="margin:2px 0"></div>
      <div class="kv"><span class="k">Topik</span><span class="v">${(c.topics||[]).length} ${weak.length?`<span class="badge b-warn" style="margin-left:4px">${weak.length} lemah</span>`:''}</span></div>
      <div class="kv"><span class="k">${nx?(nx.kind==='exam'?'Ujian':'Jadwal berikutnya'):'Status'}</span>
        <span class="v" style="color:${nx&&nx.due<todayISO()?'var(--bad)':'inherit'}">${nx?`${IDFmt.short.format(parseISO(nx.due))} • ${relDay(nx.due)}`:(c.status==='fail'?'menunggu tes ulang':(c.lastScore==null?'—':'ladder selesai'))}</span></div>
      ${c.examDate?`<div class="kv"><span class="k">Tanggal ujian</span><span class="v">${IDFmt.short.format(parseISO(c.examDate))} (${diffDays(todayISO(),c.examDate)} hari)</span></div>`:''}
    </div>
    <div class="course-foot">
      <button class="btn btn-sm" data-act="open-course" data-id="${c.id}">${icon('book')}Detail</button>
      <button class="btn btn-sm ${c.status==='fail'?'btn-bad':'btn-primary'}" data-act="score" data-id="${c.id}">${icon('target')}Isi Skor</button>
      ${nx&&nx.kind==='review'&&nx.state==='pending'?`<button class="btn btn-sm" data-act="review" data-id="${c.id}" data-item="${nx.id}">${icon('play')}Review</button>`:''}
      <button class="btn btn-sm btn-ghost" style="margin-left:auto" data-act="edit-course" data-id="${c.id}" title="Ubah">${icon('edit')}</button>
    </div>
  </div>`;
}

/* ============================== DETAIL MATKUL ============================== */
function courseDetail(c){
  if (!c) return;
  const g = gradeOf(c.lastScore, c);
  openModal({
    wide:true,
    title: esc(c.name),
    sub: `${esc(c.lecturer||'Tanpa dosen')}${c.credits?` • ${c.credits} SKS`:''} • <span class="badge ${g.cls}">${g.label}</span>`,
    body: detailBody(c),
    foot: `<button class="btn" data-act="export-ics-one" data-id="${c.id}">${icon('cal')}Export .ics matkul ini</button>
      <button class="btn" data-act="edit-course" data-id="${c.id}">${icon('edit')}Ubah</button>
      <button class="btn btn-bad" data-act="del-course" data-id="${c.id}">${icon('trash')}Hapus</button>
      <button class="btn btn-primary" data-act="score" data-id="${c.id}">${icon('target')}Isi Skor Tes</button>`,
    onMount(r){ bindActions(r); }
  });
}
function detailBody(c){
  const g = gradeOf(c.lastScore, c);
  const ladder = ladderOf(c);
  const p = courseProgress(c);
  const weak = weakTopics(c);
  let h = `<div class="grid g3" style="margin-bottom:16px">
    ${statCard('Skor terakhir', c.lastScore==null?'—':c.lastScore, c.lastScoreDate?IDFmt.short.format(parseISO(c.lastScoreDate)):'belum ada tes', c.lastScore==null?'mute':g.tier==='fail'?'bad':'ok')}
    ${statCard('Passing grade', pgOf(c)+'%', `mastery ${mgOf(c)}%`, 'brand')}
    ${statCard('Percobaan tes', (c.attempts||[]).length, `rata-rata ${avgScore(c)==null?'—':avgScore(c)+'%'}`, 'mute')}
  </div>`;

  h += `<div class="sec-title">Keputusan metode</div>
    <div class="verdict ${g.tier==='fail'?'bad':(g.tier==='pass'||g.tier==='mastery')?'ok':'warn'}">
      <h4>${icon(g.tier==='fail'?'alert':g.tier==='mastery'?'spark':'check',2.2)} ${
        c.lastScore==null ? 'Belum dinilai' :
        g.tier==='fail' ? `Belum tuntas — ${c.lastScore}% < ${pgOf(c)}%` :
        g.tier==='mastery' ? `Tuntas tingkat mastery — ${c.lastScore}% ≥ ${mgOf(c)}%` :
        `Tuntas — ${c.lastScore}% ≥ ${pgOf(c)}%`}</h4>
      <p>${
        c.lastScore==null ? 'Masukkan skor tes untuk mengaktifkan keputusan ini.' :
        g.tier==='fail' ? `Tidak memenuhi kriteria ketuntasan ${pgOf(c)}%. Sesuai desain mastery learning, materi dipelajari ulang <b>besok</b> lalu dites ulang. Jadwal spaced repetition baru terbentuk setelah skor mencapai passing grade.` :
        g.tier==='mastery' ? `Skor melewati ambang mastery ${mgOf(c)}% (Wilson dkk. 2019: ~85% adalah zona laju belajar optimum). Materi sudah terkonsolidasi, jadi dipakai ladder <b>mastery</b> yang interval awalnya lebih longgar: ${ladder.join(', ')} hari.` :
        `Skor memenuhi kriteria ketuntasan ${pgOf(c)}% tetapi belum mencapai ambang mastery ${mgOf(c)}%. Dipakai ladder <b>standar</b> dengan interval lebih rapat: ${ladder.join(', ')} hari.`}
      </p>
      ${(c.schedule||[]).length && Array.isArray(c.cums) && c.examDate && c.cums.join(',') !== ladder.join(',') ? `<ul><li>Ladder dipadatkan otomatis menjadi hari ke <b>${c.cums.join(', ')}</b> agar semua review selesai sebelum ujian ${IDFmt.short.format(parseISO(c.examDate))} (Cepeda dkk. 2008).</li></ul>` : ''}
      ${g.tier==='fail' && (c.attempts||[]).length>=RESEARCH.maxRemedialAttempts ? `<ul><li>Sudah ${(c.attempts||[]).length}× tes dan belum tuntas. Pertimbangkan memecah materi jadi bagian lebih kecil, atau ganti strategi belajar (contoh soal, ajar ulang ke orang lain).</li></ul>` : ''}
    </div>`;

  h += `<div class="sec-title">Topik / bab ${weak.length?`<span class="badge b-warn">${weak.length} di bawah passing grade</span>`:''}</div>`;
  if ((c.topics||[]).length){
    h += `<div class="card" style="overflow:hidden"><table class="tier-table"><thead><tr><th>Topik</th><th style="width:90px">Skor</th><th style="width:120px">Status</th></tr></thead><tbody>
      ${c.topics.slice().sort((a,b)=>(a.score??999)-(b.score??999)).map(t => {
        const s = t.score;
        const st = s==null ? `<span class="badge b-mute">belum dinilai</span>` : s>=mgOf(c) ? `<span class="badge b-ok">mastery</span>` : s>=pgOf(c) ? `<span class="badge b-ok">tuntas</span>` : `<span class="badge b-bad">lemah</span>`;
        return `<tr><td>${esc(t.name)}${t.weight&&t.weight!==1?` <span class="muted xsmall">(bobot ${t.weight})</span>`:''}</td>
          <td class="mono strong">${s==null?'—':s+'%'}</td><td>${st}</td></tr>`;
      }).join('')}</tbody></table></div>`;
  } else h += `<p class="small muted">Belum ada topik. Tambahkan lewat tombol Ubah agar review lebih terarah.</p>`;

  h += `<div class="sec-title">Jadwal spaced repetition <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">(${p.done}/${p.total} tahap selesai)</span></div>`;
  if ((c.schedule||[]).length){
    h += `<div class="card" style="overflow:hidden"><div class="rlist">`;
    const base = c.baseDate;
    h += c.schedule.filter(s=>s.kind!=='exam'||true).map(s => {
      const isOver = s.state==='pending' && s.due < todayISO() && s.kind!=='exam';
      const tone = s.kind==='exam'?'var(--warn)':s.kind==='remedial'?'var(--bad)':c.color;
      return `<div class="ritem ${s.state==='done'?'done':''} ${isOver?'overdue':''}" style="cursor:default">
        <div class="bar" style="background:${tone}"></div>
        <div class="stepnum" style="${s.kind==='exam'?'background:var(--warn-soft);color:var(--warn-ink)':''}">${s.kind==='exam'?icon('target',2):s.label.replace(/[RP]/,'')}</div>
        <div style="flex:1;min-width:0">
          <div class="ttl" style="font-size:13.5px">${s.kind==='exam'?'UJIAN '+esc(c.name):s.kind==='remedial'?'Belajar ulang + tes ulang':'Review '+s.label+(s.maint?' (pemeliharaan jangka panjang)':'')}</div>
          <div class="meta"><span>${IDFmt.long.format(parseISO(s.due))}</span><span class="muted">${relDay(s.due)}</span>
            ${s.offset!=null?`<span class="muted">hari ke-${s.offset} sejak tes</span>`:''}
            ${s.state==='done'?`<span class="badge b-mute">selesai${s.rating?' • '+rateLabel(s.rating):''} ${s.doneDate?IDFmt.short.format(parseISO(s.doneDate)):''}</span>`:''}
            ${s.state==='skipped'?`<span class="badge b-mute">dilewati</span>`:''}
            ${isOver?`<span class="badge b-bad">terlambat ${-diffDays(s.due,todayISO())} hr</span>`:''}</div>
        </div>
        <div class="acts">${s.state==='pending'&&s.kind==='review'?`<button class="btn btn-sm btn-primary" data-act="review" data-id="${c.id}" data-item="${s.id}">Mulai</button>`:''}</div>
      </div>`;
    }).join('');
    h += `</div></div>`;
  } else h += `<p class="small muted">Belum ada jadwal. Masukkan skor tes dulu.</p>`;

  if ((c.attempts||[]).length){
    h += `<div class="sec-title">Riwayat tes</div><div class="card" style="overflow:hidden"><table class="tier-table">
      <thead><tr><th style="width:60px">Ke-</th><th>Tanggal</th><th style="width:90px">Skor</th><th style="width:130px">Hasil</th></tr></thead><tbody>
      ${c.attempts.slice().reverse().map(a => { const ag = gradeOf(a.score, c);
        return `<tr><td class="mono">#${a.attemptNo}</td><td>${IDFmt.med.format(parseISO(a.date))}</td>
          <td class="mono strong">${a.score}%</td><td><span class="badge ${ag.cls}">${ag.label}</span></td></tr>`; }).join('')}
      </tbody></table></div>`;
  }
  return h;
}

/* ============================== MODAL: MATKUL ============================== */
let topicDraft = [];
function courseModal(c){
  const isNew = !c;
  topicDraft = isNew ? [{id:uid(),name:'',weight:1,score:null}]
    : (c.topics||[]).map(t => ({...t}));
  if (isNew && !topicDraft.length) topicDraft.push({id:uid(),name:'',weight:1,score:null});

  const body = `
  <div class="sec-title">Identitas</div>
  <div class="row">
    <div class="field" style="flex:2"><label>Nama mata kuliah *</label>
      <input class="input" id="f_name" placeholder="mis. Algoritma & Struktur Data" value="${esc(c?.name||'')}"></div>
    <div class="field"><label>Warna</label><input class="input" type="color" id="f_color" value="${c?.color||PALETTE[state.courses.length%PALETTE.length]}"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="field" style="flex:2"><label>Dosen</label><input class="input" id="f_lect" placeholder="opsional" value="${esc(c?.lecturer||'')}"></div>
    <div class="field"><label>SKS</label><input class="input" id="f_sks" type="number" min="0" max="12" step="1" placeholder="3" value="${c?.credits??''}"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="field"><label>Ruang / lokasi</label><input class="input" id="f_loc" placeholder="opsional, masuk ke .ics" value="${esc(c?.location||'')}"></div>
    <div class="field"><label>Tanggal ujian / tenggat</label><input class="input" id="f_exam" type="date" value="${c?.examDate||''}">
      <div class="help">Kalau diisi, ladder otomatis dipadatkan agar semua review selesai sebelum ujian (Cepeda dkk. 2008).</div></div>
  </div>

  <div class="sec-title">Ambang ketuntasan <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">(kosongkan = pakai default)</span></div>
  <div class="row">
    <div class="field"><label>Passing grade (%)</label><input class="input" id="f_pg" type="number" min="1" max="100" step="1" placeholder="${state.settings.passingGrade}" value="${c?.passingGrade??''}">
      <div class="help">Default ${state.settings.passingGrade}% — konsensus mastery learning.</div></div>
    <div class="field"><label>Ambang mastery (%)</label><input class="input" id="f_mg" type="number" min="1" max="100" step="1" placeholder="${state.settings.masteryGrade}" value="${c?.masteryGrade??''}">
      <div class="help">Default ${state.settings.masteryGrade}% — skor ≥ ini dapat interval lebih longgar.</div></div>
  </div>

  <div class="sec-title">Topik / bab <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">— dipakai untuk menandai topik lemah</span></div>
  <div id="topicList"></div>
  <button class="btn btn-sm" id="addTopic" type="button">${icon('plus',2.4)}Tambah topik</button>
  <div class="hr"></div>
  <p class="xsmall muted">Topik dengan skor di bawah passing grade akan ditandai <b>lemah</b> dan diprioritaskan di setiap sesi review serta di deskripsi event kalender.</p>`;

  openModal({
    title: isNew ? 'Tambah Mata Kuliah' : 'Ubah Mata Kuliah',
    sub: isNew ? 'Isi identitas, ambang ketuntasan, dan daftar topik.' : esc(c.name),
    body, wide:true,
    foot: `<button class="btn" data-close>Batal</button>
      ${isNew?'':'<button class="btn btn-bad" id="f_del">'+icon('trash')+'Hapus</button>'}
      <button class="btn btn-primary" id="f_save">${icon('check',2.4)}${isNew?'Simpan & lanjut isi skor':'Simpan perubahan'}</button>`,
    onMount(r){
      renderTopicList();
      r.querySelector('#addTopic').onclick = () => { topicDraft.push({id:uid(),name:'',weight:1,score:null}); renderTopicList(); };
      const del = r.querySelector('#f_del');
      if (del) del.onclick = () => { closeModal(); handleAct('del-course', c.id); };
      r.querySelector('#f_save').onclick = () => {
        const name = r.querySelector('#f_name').value.trim();
        if (!name){ toast('bad','Nama wajib diisi','Tulis nama mata kuliahnya dulu.'); r.querySelector('#f_name').focus(); return; }
        const num = (sel, min, max) => { const v = r.querySelector(sel).value.trim(); if (v==='') return null;
          const n = Number(v); return isNaN(n) ? null : clamp(n, min, max); };
        const data = {
          name, color: r.querySelector('#f_color').value,
          lecturer: r.querySelector('#f_lect').value.trim(),
          credits: num('#f_sks',0,12), location: r.querySelector('#f_loc').value.trim(),
          examDate: r.querySelector('#f_exam').value || null,
          passingGrade: num('#f_pg',1,100), masteryGrade: num('#f_mg',1,100),
          topics: topicDraft.filter(t => t.name.trim()).map(t => ({...t, name:t.name.trim(), weight:Number(t.weight)||1})),
        };
        if (data.passingGrade!=null && data.masteryGrade!=null && data.masteryGrade < data.passingGrade){
          toast('warn','Ambang mastery terlalu rendah','Ambang mastery harus ≥ passing grade. Diperbaiki otomatis ke '+data.passingGrade+'%.');
          data.masteryGrade = data.passingGrade;
        }
        if (isNew){
          const nc = { id:uid(), status:'ungraded', lastScore:null, attempts:[], schedule:[], history:[],
                       createdAt:new Date().toISOString(), createdAtISO:todayISO(), baseDate:todayISO(), ...data };
          state.courses.push(nc);
          buildSchedule(nc);
          logAct('add', `Mata kuliah ditambahkan: ${nc.name}`, nc.id); save(); closeModal(); renderAll();
          toast('ok','Mata kuliah ditambahkan', nc.name);
          setTimeout(() => scoreModal(nc), 260);
        } else {
          const before = { pg:pgOf(c), mg:mgOf(c), exam:c.examDate };
          Object.assign(c, data);
          const changed = before.pg!==pgOf(c) || before.mg!==mgOf(c) || before.exam!==c.examDate;
          if (changed && c.status!=='ungraded'){ buildSchedule(c); }
          logAct('edit', `Mata kuliah diperbarui: ${c.name}`, c.id); save(); closeModal(); renderAll();
          toast('ok','Perubahan disimpan', changed && c.status!=='ungraded' ? 'Jadwal dihitung ulang mengikuti ambang/tanggal ujian baru.' : c.name);
        }
      };
    }
  });

  function renderTopicList(){
    const box = $('#topicList');
    if (!box) return;
    box.innerHTML = topicDraft.map((t,i) => `<div class="topic-row" data-i="${i}">
      <input class="input" placeholder="Nama topik / bab" value="${esc(t.name)}" data-f="name">
      <input class="input sc" type="number" min="0" max="100" step="1" placeholder="skor" value="${t.score??''}" data-f="score" title="Skor topik (opsional)">
      <button class="btn btn-sm del" type="button" data-del="${i}" title="Hapus topik">${icon('trash')}</button>
    </div>`).join('');
    $$('.topic-row', box).forEach(row => {
      const i = +row.dataset.i;
      row.querySelector('[data-f=name]').oninput = e => topicDraft[i].name = e.target.value;
      row.querySelector('[data-f=score]').oninput = e => { const v = e.target.value.trim(); topicDraft[i].score = v===''?null:clamp(Number(v),0,100); };
      row.querySelector('[data-del]').onclick = () => { topicDraft.splice(i,1); if(!topicDraft.length) topicDraft.push({id:uid(),name:'',weight:1,score:null}); renderTopicList(); };
    });
  }
}

/* ============================== MODAL: SKOR TES ============================== */
function scoreModal(c){
  if (!c) return;
  const topics = c.topics || [];
  const pg = pgOf(c), mg = mgOf(c);
  const attemptNo = (c.attempts||[]).length + 1;
  const body = `
  ${c.status==='fail'?`<div class="banner bad" style="margin-bottom:16px">${icon('refresh',2.1)}<div>
    <b>Tes ulang ke-${attemptNo}</b><span>Skor sebelumnya ${c.lastScore}% — di bawah passing grade ${pg}%. Masukkan hasil tes ulang hari ini.</span></div></div>`:''}
  <div class="sec-title">Hasil tes</div>
  <div class="row">
    <div class="field" style="flex:2"><label>Tanggal tes</label>
      <input class="input" id="s_date" type="date" value="${todayISO()}" max="${todayISO()}"></div>
    <div class="field" style="flex:2"><label>Skor keseluruhan (0–100) ${topics.length?'<span class="muted" style="font-weight:600;text-transform:none">— kosongkan untuk hitung dari skor topik</span>':''}</label>
      <input class="input" id="s_score" type="number" min="0" max="100" step="0.5" placeholder="mis. 78" inputmode="decimal"></div>
  </div>

  ${topics.length?`<div class="sec-title">Skor per topik <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:600">(opsional — untuk menandai topik lemah)</span></div>
    <div id="s_topics">${topics.map(t => `<div class="topic-row">
      <div style="flex:1;min-width:0"><div class="small strong" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.name)}</div>
        ${t.score!=null?`<div class="xsmall muted">skor terakhir: ${t.score}%</div>`:''}</div>
      <input class="input sc" type="number" min="0" max="100" step="1" placeholder="${t.score!=null?t.score+'':'—'}" data-tid="${t.id}"></div>`).join('')}</div>`:''}

  <div id="verdict"></div>`;

  openModal({
    title:`Isi Skor Tes — ${esc(c.name)}`,
    sub:`Percobaan ke-${attemptNo} • passing grade ${pg}% • ambang mastery ${mg}%`,
    body,
    foot:`<button class="btn" data-close>Batal</button>
      <button class="btn btn-primary" id="s_save">${icon('check',2.4)}Simpan & buat jadwal</button>`,
    onMount(r){
      const sIn = r.querySelector('#s_score');
      const tIns = $$('[data-tid]', r);
      const box = r.querySelector('#verdict');
      function readTopics(){
        const m = {};
        tIns.forEach(i => { const v = i.value.trim(); if (v!=='') m[i.dataset.tid] = clamp(Number(v),0,100); });
        return m;
      }
      function currentScore(){
        const v = sIn.value.trim();
        if (v !== '') return clamp(Number(v), 0, 100);
        const ts = readTopics(); const arr = Object.values(ts);
        if (!arr.length) return null;
        const tw = topics.filter(t => ts[t.id]!=null);
        const sumW = tw.reduce((s,t)=>s+(Number(t.weight)||1),0) || arr.length;
        const sum = tw.reduce((s,t)=>s+ts[t.id]*(Number(t.weight)||1),0) || arr.reduce((a,b)=>a+b,0);
        return round1(sum/sumW);
      }
      function paint(){
        const sc = currentScore();
        if (sc == null){ box.innerHTML = `<div class="verdict warn" style="border-color:var(--line);background:var(--card-2)">
          <h4>${icon('info',2.2)} Masukkan skor untuk melihat keputusan</h4>
          <p>Jeda akan memutuskan otomatis: <b>tuntas</b> → susun jadwal spaced repetition; <b>belum tuntas</b> → belajar ulang besok.</p></div>`; return; }
        const g = gradeOf(sc, c);
        const ladder = g.tier==='mastery' ? state.settings.ladderMastery : state.settings.ladderStandard;
        const base = r.querySelector('#s_date').value || todayISO();
        if (g.tier === 'fail'){
          box.innerHTML = `<div class="verdict bad">
            <h4>${icon('alert',2.2)} Belum tuntas — ${sc}% &lt; ${pg}%</h4>
            <p><b>Belajar ulang besok (${IDFmt.med.format(parseISO(addDays(base,1)))})</b>, lalu tes ulang.
            Sesuai prinsip mastery learning, materi yang belum tuntas tidak boleh langsung masuk siklus spaced repetition —
            retrieval practice hanya memperkuat jejak memori yang sudah benar.</p>
            <ul>
              <li>Pelajari ulang materinya — jangan baca ulang pasif, kerjakan soal tanpa melihat kunci.</li>
              ${(()=>{ const ts=readTopics(); const w=topics.filter(t=>ts[t.id]!=null&&ts[t.id]<pg); return w.length?`<li>Fokus ke topik lemah: <b>${esc(w.map(t=>`${t.name} (${ts[t.id]}%)`).join(', '))}</b>.</li>`:''; })()}
              <li>Besok, buka Jeda dan masukkan skor tes ulang. Begitu ≥ ${pg}%, jadwal spaced repetition langsung terbentuk.</li>
              ${attemptNo>=RESEARCH.maxRemedialAttempts?`<li>Sudah ${attemptNo} percobaan. Pecah materi jadi bagian lebih kecil atau ganti strategi (ajarkan ulang ke teman, kerjakan soal variasi).</li>`:''}
            </ul></div>`;
        } else {
          const kind = g.tier==='mastery'?'mastery':'standar';
          box.innerHTML = `<div class="verdict ok">
            <h4>${icon(g.tier==='mastery'?'spark':'check',2.2)} ${g.tier==='mastery'?`Tuntas tingkat mastery — ${sc}% ≥ ${mg}%`:`Tuntas — ${sc}% ≥ ${pg}%`}</h4>
            <p>Ladder <b>${kind}</b> diaktifkan. Review terjadwal pada hari ke <b>${ladder.join(', ')}</b> sejak tes,
            lalu pemeliharaan jangka panjang hari ke ${RESEARCH.maintenance.join(' dan ')}.</p>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
              ${ladder.map((d,i)=>`<span class="chip" style="${i===0?'background:var(--brand);color:#fff':''}">R${i+1} • ${IDFmt.short.format(parseISO(addDays(base,d)))}</span>`).join('')}
            </div>
            ${g.tier==='mastery'?`<p style="margin-top:10px;opacity:.85">Skor di atas ~85% berarti materi sudah terkonsolidasi, jadi interval awal lebih longgar (Wilson dkk., 2019).</p>`:''}
          </div>`;
        }
      }
      sIn.oninput = paint; tIns.forEach(i => i.oninput = paint); r.querySelector('#s_date').onchange = paint;
      paint();
      setTimeout(()=>sIn.focus(), 80);

      r.querySelector('#s_save').onclick = () => {
        const sc = currentScore();
        if (sc == null){ toast('bad','Skor belum diisi','Isi skor keseluruhan atau skor minimal satu topik.'); sIn.focus(); return; }
        const date = r.querySelector('#s_date').value || todayISO();
        const res = recordScore(c, { date, score: sc, topicScores: readTopics() });
        closeModal(); renderAll();
        const nx = nextItem(c);
        if (res.tier === 'fail'){
          toast('bad','Belum tuntas — belajar ulang besok', `Skor ${sc}% di bawah passing grade ${pgOf(c)}%. Jadwal: ${nx?IDFmt.med.format(parseISO(nx.due)):'besok'} untuk belajar ulang + tes ulang.`);
        } else {
          toast('ok', res.tier==='mastery'?'Tuntas tingkat mastery!':'Tuntas — jadwal dibuat',
            `${(c.schedule||[]).filter(s=>s.kind==='review').length} sesi review tersusun. ${nx?`Mulai ${IDFmt.med.format(parseISO(nx.due))} (${relDay(nx.due)}).`:''} Jangan lupa export ke kalender.`);
        }
      };
    }
  });
}

/* ============================== MODAL: SESI REVIEW ============================== */
function reviewModal(c, courseId, itemId){
  if (!c) return;
  const ev = (c.schedule||[]).find(s => s.id === itemId);
  if (!ev) return;
  const done = ev.state === 'done';
  const weak = weakTopics(c);
  const strong = (c.topics||[]).filter(t => typeof t.score==='number' && t.score >= pgOf(c));
  const ladder = activeLadder(c);
  const ladderAsli = ladderOf(c);
  const compressed = ladderAsli.join(',') !== ladder.join(',');

  const body = `
  <div style="display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <div class="course-av" style="background:${c.color||'#4f46e5'}">${ev.kind==='exam'?icon('target',2.2):ev.label.replace(/[RP]/,'')}</div>
    <div><div style="font-weight:800;font-size:15px">${ev.kind==='exam'?'Ujian':ev.kind==='remedial'?'Belajar ulang':'Review '+ev.label}${ev.maint?' <span class="muted small">(pemeliharaan jangka panjang)</span>':''}</div>
      <div class="xsmall muted">Jatuh tempo ${IDFmt.long.format(parseISO(ev.due))} • ${relDay(ev.due)}${ev.offset!=null?` • hari ke-${ev.offset} sejak tes`:''}</div></div>
    <div style="margin-left:auto"><span class="badge ${done?'b-mute':ev.due<todayISO()?'b-bad':'b-brand'}">${done?'Sudah selesai'+(ev.rating?' • '+rateLabel(ev.rating):''):ev.due<todayISO()?'Terlambat':'Jatuh tempo'}</span></div>
  </div>

  <div class="banner info" style="margin-bottom:14px">${icon('brain',2)}<div>
    <b>Lakukan retrieval practice, bukan baca ulang</b>
    <span>Roediger &amp; Karpicke (2006): mencoba mengingat aktif meningkatkan retensi jangka panjang jauh lebih baik daripada membaca ulang materi. Tutup catatan dulu, tulis semua yang kamu ingat, baru cek.</span></div></div>

  ${(c.topics||[]).length?`
  <div class="sec-title">Fokus sesi ini</div>
  <div style="display:flex;flex-direction:column;gap:7px">
    ${weak.map(t=>topicLine(t,'bad')).join('')}
    ${strong.map(t=>topicLine(t,'ok')).join('')}
    ${(c.topics||[]).filter(t=>t.score==null).map(t=>topicLine(t,'mute')).join('')}
  </div>`:''}

  <div class="sec-title">Langkah sesi (${state.settings.durationMin} menit)</div>
  <ol style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.75">
    <li>Tutup semua catatan. Tulis/ucapkan dari ingatan: definisi, rumus, alur, dan contoh soal tiap topik.</li>
    ${weak.length?`<li>Dahulukan topik lemah: <b>${esc(weak.map(t=>t.name).join(', '))}</b>.</li>`:'<li>Bagi waktu rata ke semua topik.</li>'}
    <li>Buka catatan, tandai bagian yang keliru atau hilang — bagian inilah yang perlu diulang.</li>
    <li>Tutup lagi, ulangi bagian yang salah sekali tanpa melihat.</li>
    <li>Kerjakan 2–3 soal latihan sebagai tes diri singkat.</li>
  </ol>

  ${done ? `<div class="verdict ok"><h4>${icon('check',2.2)} Sesi sudah ditandai selesai</h4>
    <p>Nilai: <b>${rateLabel(ev.rating||'easy')}</b>${ev.doneDate?` pada ${IDFmt.long.format(parseISO(ev.doneDate))}`:''}.</p></div>` : `
  <div class="sec-title">Nilai sesi ini — menentukan jadwal berikutnya</div>
  <div class="rate-btns">
    <button class="rate r-ok" data-rate="easy"><b>Lancar</b><span>Ingat hampir semua. Lanjut ke tahap ${nextRungLabel(c, ev, 'easy')} (${nextGapText(c,ev,'easy')}).</span></button>
    <button class="rate r-warn" data-rate="hard"><b>Agak sulit</b><span>Ingat tapi perlu mikir. Ulangi tahap ini dengan jeda lebih pendek (${nextGapText(c,ev,'hard')}).</span></button>
    <button class="rate r-bad" data-rate="again"><b>Lupa</b><span>Hampir tidak ingat. Kembali ke tahap 1, review lagi ${nextGapText(c,ev,'again')}.</span></button>
  </div>`}`;

  openModal({
    title: esc(c.name),
    sub: `${c.lecturer?esc(c.lecturer)+' • ':''}skor tes terakhir ${c.lastScore??'—'}%`,
    body, wide:true,
    foot: done
      ? `<button class="btn" id="r_undo">${icon('refresh')}Tandai belum selesai</button><button class="btn btn-primary" data-close>Tutup</button>`
      : `<button class="btn" data-act="skip" data-id="${c.id}" data-item="${ev.id}" id="r_skip">Lewati</button>
         <button class="btn" data-act="export-ics-one" data-id="${c.id}">${icon('cal')}Export .ics</button>
         <button class="btn btn-primary" data-close>Tutup</button>`,
    onMount(r){
      bindActions(r);
      const skipB = r.querySelector('#r_skip');
      if (skipB) skipB.addEventListener('click', () => setTimeout(closeModal, 0));
      $$('[data-rate]', r).forEach(b => b.onclick = () => {
        const rating = b.dataset.rate;
        const item = completeItem(c, ev.id, rating);
        const nx = nextItem(c);
        closeModal(); renderAll();
        const msg = rating==='again'
          ? `Kembali ke tahap 1. Review lagi ${nx?IDFmt.med.format(parseISO(nx.due))+' ('+relDay(nx.due)+')':'besok'}.`
          : rating==='hard'
          ? `Tahap diulang dengan jeda pendek. Berikutnya ${nx?IDFmt.med.format(parseISO(nx.due))+' ('+relDay(nx.due)+')':'—'}.`
          : nx ? `Tahap berikutnya ${nx.label} pada ${IDFmt.med.format(parseISO(nx.due))} (${relDay(nx.due)}).` : 'Seluruh ladder selesai — materi masuk memori jangka panjang.';
        toast(rating==='again'?'warn':'ok', `${c.name} — ${rateLabel(rating)}`, msg);
      });
      const un = r.querySelector('#r_undo');
      if (un) un.onclick = () => { undoItem(c, ev.id); closeModal(); renderAll(); toast('warn','Dibatalkan','Sesi dikembalikan ke status belum selesai.'); };
    }
  });

  function topicLine(t, tone){
    const col = tone==='bad'?'var(--bad)':tone==='ok'?'var(--ok)':'var(--ink-3)';
    const bg  = tone==='bad'?'var(--bad-soft)':tone==='ok'?'var(--ok-soft)':'var(--bg-2)';
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:${bg}">
      <span class="dot" style="background:${col}"></span>
      <span style="flex:1;min-width:0;font-size:13px;font-weight:650">${esc(t.name)}</span>
      ${tone==='bad'?`<span class="badge b-bad">lemah${t.score!=null?' • '+t.score+'%':''}</span>`:tone==='ok'?`<span class="badge b-ok">tuntas${t.score!=null?' • '+t.score+'%':''}</span>`:`<span class="badge b-mute">belum dinilai</span>`}
    </div>`;
  }
}
function nextRungLabel(c, ev, rating){
  const ladder = activeLadder(c);
  const r = rating==='again' ? 1 : (rating==='hard' ? ev.rung : ev.rung + 1);
  if (r > ladder.length) return 'P' + (r - ladder.length) + ' (pemeliharaan)';
  if (r > totalRungs(ladder)) return 'selesai';
  return 'R' + r;
}
function nextGapText(c, ev, rating){
  const ladder = activeLadder(c);
  const total = totalRungs(ladder);
  const nextRung = rating==='again'?1:(rating==='hard'?ev.rung:ev.rung+1);
  let gap;
  if (rating==='again') gap = RESEARCH.remedialGapDays;
  else { const g = rungGap(ladder, Math.min(nextRung,total)); gap = rating==='hard'?Math.max(1,Math.round(g*0.5)):g; }
  return gap + ' hari lagi';
}

/* ============================== KALENDER ============================== */
function renderCalendar(){
  const m = route.month;
  const y = m.getFullYear(), mo = m.getMonth();
  const first = new Date(y, mo, 1);
  const ws = state.settings.weekStart;
  const dowNames = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  const order = [...dowNames.slice(ws), ...dowNames.slice(0, ws)];
  let startOffset = (first.getDay() - ws + 7) % 7;
  const gridStart = new Date(y, mo, 1 - startOffset);
  const dim = new Date(y, mo + 1, 0).getDate();
  const nCells = Math.ceil((startOffset + dim) / 7) * 7;

  const evByDay = {};
  allEvents().forEach(e => { (evByDay[e.due] = evByDay[e.due] || []).push(e); });
  Object.values(evByDay).forEach(a => a.sort((x,y2) => (x.kind==='exam'?-1:1) - (y2.kind==='exam'?-1:1) || x.due.localeCompare(y2.due)));

  const cells = [];
  for (let i = 0; i < nCells; i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate() + i);
    cells.push(d);
  }
  const today = todayISO();
  let h = `<div class="card" style="overflow:hidden">
    <div class="cal-head">
      <div class="cal-title">${IDFmt.month.format(m)}</div>
      <div class="cal-nav">
        <button class="btn btn-sm btn-icon" id="calPrev">${icon('left',2.2)}</button>
        <button class="btn btn-sm" id="calToday">Hari ini</button>
        <button class="btn btn-sm btn-icon" id="calNext">${icon('right',2.2)}</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin-left:12px">
        <span style="display:flex;align-items:center;gap:4px"><span class="dot" style="background:var(--brand)"></span>Review</span>
        <span style="display:flex;align-items:center;gap:4px"><span class="dot" style="background:var(--bad)"></span>Belajar ulang</span>
        <span style="display:flex;align-items:center;gap:4px"><span class="dot" style="background:var(--warn)"></span>Ujian</span>
      </div>
    </div>
    <div class="cal-grid">${order.map(d => `<div class="cal-dow">${d}</div>`).join('')}`;
  cells.forEach(d => {
    const iso = toISO(d);
    const evs = evByDay[iso] || [];
    const out = d.getMonth() !== mo;
    const show = evs.slice(0, 3);
    h += `<div class="cal-cell ${out?'out':''} ${iso===today?'today':''} ${iso===route.selDay?'sel':''} ${[0,6].includes(d.getDay())?'weekend':''}" data-day="${iso}">
      <div class="cal-dnum">${d.getDate()}</div>
      ${show.map(e => {
        const cls = e.kind==='exam'?'t-exam':e.kind==='remedial'?'t-remedial':'';
        const dn = e.state==='done'?'t-done':'';
        return `<div class="cal-ev ${cls} ${dn}" style="border-left-color:${e.kind==='review'?e.course.color:''}" data-ev="${e.id}" data-course="${e.course.id}" title="${esc(e.course.name)} — ${e.label}">
          <span>${esc(e.kind==='exam'?'UJIAN':e.label)}</span> ${esc(e.course.name)}</div>`;
      }).join('')}
      ${evs.length>3?`<div class="cal-more">+${evs.length-3} lainnya</div>`:''}
    </div>`;
  });
  h += `</div></div>`;

  h += `<div class="split" style="margin-top:16px">
    <div class="card"><div class="card-head"><h3>${icon('cal',2)}</h3><h3 id="dayTitle">Detail hari</h3>
      <div class="right"><button class="btn btn-sm" data-act="export-ics-all">${icon('down')}Export semua .ics</button></div></div>
      <div id="dayBody"></div></div>
    <div class="card card-pad">
      <h3 style="font-size:14.5px;margin-bottom:10px">Ringkasan bulan ini</h3>
      ${monthStats(mo, y)}
      <div class="hr"></div>
      <p class="xsmall muted" style="line-height:1.6">Event kalender memakai jam review
        <b>${String(state.settings.reviewHour).padStart(2,'0')}:${String(state.settings.reviewMinute).padStart(2,'0')}</b>
        dengan pengingat <b>${state.settings.alarmMin} menit</b> sebelumnya${state.settings.alarmAtTime?' dan tepat pada waktunya':''}.
        Ubah di Pengaturan, lalu export ulang file .ics.</p>
      <button class="btn btn-sm btn-block" style="margin-top:10px" data-go="settings">${icon('gear')}Ubah jam & pengingat</button>
    </div>
  </div>`;

  $('#view-calendar').innerHTML = h;
  $('#calPrev').onclick = () => { route.month = new Date(y, mo-1, 1); renderCalendar(); };
  $('#calNext').onclick = () => { route.month = new Date(y, mo+1, 1); renderCalendar(); };
  $('#calToday').onclick = () => { route.month = new Date(); route.selDay = todayISO(); renderCalendar(); };
  $$('.cal-cell').forEach(cell => cell.onclick = ev => {
    const t = ev.target.closest('[data-ev]');
    if (t){ const c = byId(t.dataset.course); const it = (c.schedule||[]).find(s=>s.id===t.dataset.ev);
      if (c && it){ if (it.kind==='review') reviewModal(c, c.id, it.id); else if (it.kind==='remedial') scoreModal(c); else courseDetail(c); return; } }
    route.selDay = cell.dataset.day; renderCalendar();
  });
  paintDay();
  bindActions();
}
function paintDay(){
  const iso = route.selDay || todayISO();
  const t = $('#dayTitle'), b = $('#dayBody');
  if (!t || !b) return;
  t.innerHTML = `${IDFmt.long.format(parseISO(iso))} <span class="hint">${relDay(iso)}</span>`;
  const evs = dueOn(iso).sort((a,b2)=>(a.state==='done'?1:0)-(b2.state==='done'?1:0));
  if (!evs.length){ b.innerHTML = `<div class="empty" style="padding:32px 20px">${icon('cal',1.7)}<h4>Tidak ada jadwal</h4><p class="small">Hari ini bebas dari review.</p></div>`; return; }
  b.innerHTML = `<div class="rlist">${evs.map(e => {
    const c = e.course;
    return `<div class="ritem ${e.state==='done'?'done':''}">
      <div class="bar" style="background:${e.kind==='exam'?'var(--warn)':e.kind==='remedial'?'var(--bad)':c.color}"></div>
      <div class="stepnum">${e.kind==='exam'?icon('target',2):e.kind==='remedial'?icon('refresh',2):e.label.replace(/[RP]/,'')}</div>
      <div style="flex:1;min-width:0"><div class="ttl">${esc(c.name)}</div>
        <div class="meta"><span>${e.kind==='exam'?'UJIAN':e.kind==='remedial'?'Belajar ulang + tes ulang':'Review '+e.label}${e.maint?' (pemeliharaan)':''}</span>
        <span class="muted">${state.settings.reviewHour?String(state.settings.reviewHour).padStart(2,'0'):'00'}:${String(state.settings.reviewMinute).padStart(2,'0')}</span>
        ${e.state==='done'?`<span class="badge b-mute">selesai${e.rating?' • '+rateLabel(e.rating):''}</span>`:e.state==='skipped'?`<span class="badge b-mute">dilewati</span>`:e.due<todayISO()?`<span class="badge b-bad">terlambat</span>`:''}</div></div>
      <div class="acts">${e.state==='pending'&&e.kind==='review'?`<button class="btn btn-sm btn-primary" data-act="review" data-id="${c.id}" data-item="${e.id}">Mulai</button>`:''}
        ${e.state==='pending'&&e.kind==='remedial'?`<button class="btn btn-sm btn-bad" data-act="score" data-id="${c.id}">Isi skor</button>`:''}
        <button class="btn btn-sm btn-ghost" data-act="open-course" data-id="${c.id}">Detail</button></div></div>`;
  }).join('')}</div>`;
  bindActions(b);
}
function monthStats(mo, y){
  const evs = allEvents().filter(e => { const d = parseISO(e.due); return d.getMonth()===mo && d.getFullYear()===y; });
  const rev = evs.filter(e=>e.kind==='review');
  const dn = rev.filter(e=>e.state==='done').length;
  const rem = evs.filter(e=>e.kind==='remedial').length;
  const ex = evs.filter(e=>e.kind==='exam');
  return `<div style="display:flex;flex-direction:column;gap:8px">
    ${miniRow('Total sesi review', rev.length, 'brand')}
    ${miniRow('Sudah dikerjakan', dn, 'ok')}
    ${miniRow('Belum / terlewat', rev.length-dn, rev.length-dn?'bad':'mute')}
    ${miniRow('Sesi belajar ulang', rem, rem?'bad':'mute')}
    ${ex.length?`<div class="hr" style="margin:2px 0"></div>${ex.map(e=>`<div class="kv"><span class="k">${icon('target')} Ujian ${esc(e.course.name)}</span><span class="v">${IDFmt.short.format(parseISO(e.due))}</span></div>`).join('')}`:''}
    <div class="progress ${dn?'ok':''}"><i style="width:${rev.length?Math.round(dn/rev.length*100):0}%"></i></div>
  </div>`;
}

        ['3','Cepeda, N. J., Pashler, H., Vul, E., Wixted, J. T., & Rohrer, D. (2006). "Distributed Practice in Verbal Recall Tasks: A Review and Quantitative Synthesis." <i>Psychological Bulletin</i>, 132(3), 354–380.',

        ['4','Cepeda, N. J., Vul, E., Rohrer, D., Wixted, J. T., & Pashler, H. (2008). "Spacing Effects in Learning: A Temporal Ridgeline of Optimal Retention." <i>Psychological Science</i>, 19(11), 1095–1102.',
         'Celah optimal ≈ 20–40% dari test delay 1 minggu, turun ke ~5% untuk delay setahun. Jadi dasar pemadatan ladder otomatis ketika tanggal ujian dekat.'],
        ['5','Karpicke, J. D., & Roediger, H. L. (2007). "Expanding Retrieval Practice Promotes Short-Term Retention, but Equally Spaced Retrieval Enhances Long-Term Retention." <i>JEP: Learning, Memory, and Cognition</i>, 33(4), 617–630.',
         'Expanding retrieval unggul untuk retensi jangka pendek; untuk jangka panjang pola yang lebih merata lebih baik. Jeda memakai ladder yang melebar di awal lalu melandai (1→3→7→14→30→60).'],
        ['6','Roediger, H. L., & Karpicke, J. D. (2006). "Test-Enhanced Learning: Taking Memory Tests Improves Long-Term Retention." <i>Psychological Science</i>, 17(3), 249–255.',

        ['8','McGaghie, W. C., Issenberg, S. B., Petrusa, E. R., & Scalese, R. J. (2010). "A critical review of simulation-based medical education research." <i>Medical Education</i>, 44(1), 50–55.',
         'Tinjauan kritis: mastery learning dengan DP menaikkan akuisisi dan retensi keterampilan secara konsisten dibanding pengajaran konvensional.'],
        ['9','Storm, B. C., Bjork, E. L., & Storm, J. C. (2010). "When and why expanding retrieval practice enhances long-term retention." <i>Memory & Cognition</i>.',

      ].map(([n,t,d])=>`<div class="cite"><div class="no">${n}</div><div><b>${t}</b><p>${d}</p></div></div>`).join('')}
      </div>
    </div>

    <div class="card card-pad" style="background:var(--brand-soft);border-color:transparent">
      <h3 style="font-size:14px;color:var(--brand-ink);margin-bottom:8px">${icon('spark',2.2)} Catatan jujur soal batasannya</h3>
      <ul class="xsmall" style="margin:0;padding-left:18px;line-height:1.7;color:var(--brand-ink);opacity:.9">
        <li>Angka 80%/85% berasal dari riset laboratorium dan pendidikan kesehatan. Untuk matkul dengan KKM resmi sendiri (mis. 70% atau 75%), ubah passing grade-nya per mata kuliah — sistem tetap berjalan sama.</li>
        <li>Wilson dkk. meneliti tugas diskriminasi dua pilihan, bukan ujian esai. 85% dipakai di sini sebagai <i>penanda</i> konsolidasi, bukan hukum universal.</li>
        <li>Skor tes tunggal itu pengukuran yang bising. Karena itu Jeda menyimpan riwayat semua percobaan dan menilai ulang ladder setiap kali ada tes baru.</li>
        <li>Jeda mengatur <i>kapan</i> mengulang. Efektivitasnya tetap bergantung pada kualitas sesi review (retrieval practice, bukan baca ulang).</li>

  </div>
  </div>`;
  bindActions();
}

  const q = s => $(s);

    el.onchange = () => { const v = Number(el.value); S[key] = isNaN(v) ? S[key] : clamp(Math.round(v), min, max); el.value = S[key]; after&&after(); persist(); }; };
  const bindLad = (sel, key) => { const el = q(sel); if(!el) return;
    el.onchange = () => {
      const arr = el.value.split(',').map(x=>Number(x.trim())).filter(n=>!isNaN(n)&&n>0).sort((a,b)=>a-b);
      if (!arr.length){ toast('bad','Ladder tidak valid','Isi minimal satu angka positif, pisahkan dengan koma.'); el.value = lad(S[key]); return; }
      S[key] = Array.from(new Set(arr)); el.value = lad(S[key]); persist();
    }; };
  function persist(){
    if (S.masteryGrade < S.passingGrade) S.masteryGrade = S.passingGrade;
    save();
    state.courses.forEach(c => { if (['pass','mastery','fail'].includes(c.status)) buildSchedule(c); });
    save(); renderAll();
    toast('ok','Pengaturan disimpan','Jadwal yang belum dikerjakan dihitung ulang.');
  }

  q('#importFile').onchange  = e => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value=''; };
  q('#ics_future').onclick   = () => exportICS(selCourses(), { fromISO: todayISO(), includeDone: q('#ics_done').checked });

  function selCourses(){ const id = q('#ics_course').value; const c = id ? [byId(id)].filter(Boolean) : null; return c; }
  function updateCount(){
    const { count } = buildICS(selCourses(), { includeDone: q('#ics_done').checked, fromISO: todayISO() });
    const el = q('#ics_count'); if (el) el.textContent = count + ' event';
  }
  updateCount();
  bindActions();
}

function renderView(){
  const map = { dash:renderDash, courses:renderCourses, calendar:renderCalendar, method:renderMethod, settings:renderSettings };
  $$('.view').forEach(v => v.classList.remove('active'));
  const el = $('#view-' + route.view);
  if (el) el.classList.add('active');
  (map[route.view] || renderDash)();
}
function renderAll(){ renderNav(); renderActions(); renderView(); }

/* ============================== TEMA ============================== */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const lab = $('#themeLabel'); if (lab) lab.textContent = t === 'dark' ? 'Mode Terang' : 'Mode Gelap';
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0f1119' : '#4f46e5');
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(cur);
  try { localStorage.setItem(THEME_KEY, cur); } catch(e){}
}

/* ============================== DATA CONTOH ============================== */
function seedDemo(){
  const t = todayISO();
  const mk = (name, lecturer, credits, color, exam, topics, score, daysAgo) => {
    const c = { id:uid(), name, lecturer, credits, color, location:'', examDate:exam,
      passingGrade:null, masteryGrade:null, status:'ungraded', lastScore:null, attempts:[], schedule:[], history:[],
      topics: topics.map(x=>({id:uid(), name:x[0], weight:1, score:null, _s:x[1]})),
      createdAt:new Date().toISOString(), createdAtISO:addDays(t,-daysAgo), baseDate:addDays(t,-daysAgo) };
    const ts = {}; c.topics.forEach(x => { if (x._s!=null) ts[x.id] = x._s; });
    if (score != null) recordScore(c, { date: addDays(t,-daysAgo), score, topicScores: ts });
    else { c.topics.forEach(x=>delete x._s); buildSchedule(c); }
    return c;
  };
  const demo = [
    mk('Struktur Data','Dr. Ayu Pratiwi',3,'#4f46e5', addDays(t,26), [['Array & Linked List',92],['Stack & Queue',88],['Tree & Traversal',74],['Graph & BFS/DFS',61],['Hashing',83]], 82, 12),
    mk('Kalkulus II','Prof. Bambang Setiaji',4,'#e0405f', addDays(t,19), [['Integral Parsial',68],['Integral Trigonometri',55],['Deret Tak Hingga',72],['Persamaan Diferensial',49]], 63, 4),
    mk('Basis Data','Rina Wijaya, M.Kom.',3,'#0f9d6e', addDays(t,40), [['Model ER & Normalisasi',95],['SQL Query',91],['Transaksi & ACID',87],['Indexing',90]], 91, 8),
    mk('Statistika','Dr. Hendra Kusuma',3,'#c97a05', null, [['Distribusi Normal',78],['Uji Hipotesis',71],['Regresi Linear',80],['ANOVA',66]], 76, 2),
    mk('Jaringan Komputer','Ir. Siti Rahmawati',3,'#1f7ae0', addDays(t,55), [['OSI & TCP/IP',84],['Subnetting',58],['Routing',77],['Keamanan Jaringan',81]], null, 1),
  ];
  state.courses = demo;
  // tandai sebagian sesi sudah selesai supaya terlihat progresnya
  const c0 = demo[0];
  (c0.schedule||[]).filter(s=>s.kind==='review' && s.due < t).forEach(s => { s.state='done'; s.rating = s.rung<=2?'easy':'hard'; s.doneDate = s.due; });
  logAct('demo','Data contoh dimuat (5 mata kuliah)');
  save(); renderAll();
  toast('ok','Data contoh dimuat','5 matkul dengan berbagai kondisi: tuntas, mastery, belum tuntas, dan belum dinilai.');
}

/* ============================== API PUBLIK ==============================
   Dipakai untuk debugging / integrasi dari console browser.
   Contoh:  Jeda.state.courses            -> lihat semua data
            Jeda.buildICS(null).text      -> cetak isi file .ics
            Jeda.exportICS(null)          -> unduh kalender
   ====================================================================== */
window.Jeda = {
  get state(){ return state; },
  set state(v){ state = v; save(); renderAll(); },
  save, load: () => { state = load(); renderAll(); },
  reset(){ state = defaultState(); save(); renderAll(); },
  buildSchedule, recordScore, completeItem, buildICS, exportICS, exportJSON, importJSON,
  gradeOf, pgOf, mgOf, ladderOf, nextItem, dueToday, overdue, upcoming, allEvents,
  seedDemo, go, RESEARCH, version: '1.0.0',
};

/* ============================== PWA: INSTAL & OFFLINE ============================== */
let deferredPrompt = null;
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch(e){ return false; } };
function pwaStatus(){
  if (isStandalone()) return { cls:'b-ok',  text:'terinstal sebagai aplikasi' };
  if (!/^https?:$/.test(location.protocol)) return { cls:'b-bad', text:'file lokal — sajikan via https:// agar bisa diinstal & offline' };
  if (deferredPrompt) return { cls:'b-ok',  text:'siap diinstal' };
  if ('serviceWorker' in navigator) return { cls:'b-mute', text:'siap — prompt muncul otomatis / lewat menu browser' };
  return { cls:'b-mute', text:'browser tidak mendukung instalasi' };
}
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  $$('.js-install').forEach(b => b.classList.remove('hide'));
});
window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  $$('.js-install').forEach(b => b.classList.add('hide'));
  toast('ok','Aplikasi terinstal','Jeda sekarang ada di layar utama dan tetap bisa dibuka tanpa internet.');
  renderAll();
});
function installApp(){
  if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; }); return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
  openModal({
    title:'Instal Jeda di perangkat ini',
    body: (ios
      ? `<ol style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.8">
          <li>Buka halaman ini di <b>Safari</b> (instalasi iOS hanya bekerja dari Safari).</li>
          <li>Ketuk tombol <b>Bagikan</b> (ikon kotak dengan panah ke atas).</li>
          <li>Pilih <b>Tambahkan ke Layar Utama</b> → <b>Tambahkan</b>.</li>
          <li>Ikon Jeda muncul di layar utama dan terbuka fullscreen seperti aplikasi native.</li>
        </ol>`
      : `<ol style="margin:0;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.8">
          <li>Buka halaman ini di <b>Chrome / Edge</b>.</li>
          <li>Ketuk menu <b>⋮</b> (atau ⋯ di desktop) → <b>Instal aplikasi</b> / <b>Tambahkan ke layar utama</b>.</li>
          <li>Setuju pada dialog yang muncul.</li>
          <li>Jeda berjalan di jendela sendiri, tanpa address bar, dan tetap bisa offline.</li>
        </ol>`) +
        `<div class="banner info" style="margin-top:14px;padding:11px 13px">${icon('info',2.1)}<div>
          <span>Instalasi butuh halaman disajikan lewat <b>https://</b> (mis. Netlify/GitHub Pages). Kalau kamu membuka file ini langsung dari penyimpanan, ikuti panduan di <b>DEPLOY.md</b>.</span></div></div>`,
    foot:`<button class="btn btn-primary" data-close>Mengerti</button>`
  });
}
/*__SW_REGISTER_START__*/
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            openModal({ title:'Versi baru tersedia',
              body:`<p class="small" style="color:var(--ink-2);line-height:1.6">Jeda versi terbaru sudah diunduh di latar belakang.
                Muat ulang halaman untuk memakainya. Datamu aman — semuanya tersimpan di perangkat ini, bukan di server.</p>`,
              foot:`<button class="btn" data-close>Nanti saja</button>
                    <button class="btn btn-primary" id="swReload">Muat ulang sekarang</button>`,
              onMount(r){ r.querySelector('#swReload').onclick = () => location.reload(); } });
          }
        });
      });
    }).catch(() => {});
  });
}
/*__SW_REGISTER_END__*/

/* ============================== INIT ============================== */
(function init(){
  let theme = 'light';
  try { theme = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch(e){}
  applyTheme(theme);

  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-go]');
    if (!b) return;
    if (b.dataset.go) { e.preventDefault(); go(b.dataset.go); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); go('courses'); setTimeout(()=>{const q=$('#q'); if(q) q.focus();},60); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){ e.preventDefault(); courseModal(); }
  });

  // migrasi ringan: pastikan setiap matkul punya field yang dibutuhkan
  state.courses.forEach(c => {
    c.attempts = c.attempts || []; c.schedule = c.schedule || []; c.topics = c.topics || [];
    c.history = c.history || [];
    if (!c.baseDate) c.baseDate = c.lastScoreDate || c.createdAtISO || todayISO();
    if (!c.status) c.status = c.lastScore == null ? 'ungraded' : gradeOf(c.lastScore, c).tier;
    if (c.examDate && !(c.schedule||[]).length) buildSchedule(c);
  });

  renderAll();
  bindActions();

  // sapaan + pengingat in-app saat dibuka
  setTimeout(() => {
    const due = actionable(dueToday()).length, over = overdue().length;
    if (!state.courses.length) toast('info','Selamat datang di Jeda','Tambahkan mata kuliah pertama, atau muat data contoh dari dashboard.');
    else if (over) toast('bad', `${over} review terlambat`, 'Buka tab Hari Ini untuk mengejar ketinggalan.');
    else if (due) toast('ok', `${due} sesi review hari ini`, 'Klik "Mulai sesi" lalu kerjakan dengan retrieval practice.');
    if (!Store.live) setTimeout(()=>toast('warn','Penyimpanan tidak aktif','Data hanya bertahan selama tab terbuka. Buka file ini langsung di browser atau pakai Backup JSON.'), 900);
  }, 500);
})();
</script>
</body>
</html>
